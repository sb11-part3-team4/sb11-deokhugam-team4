services:
  db:
    image: postgres:17-alpine
    container_name: deokhugam-postgres
    ports:
      - "54321:5432"
    environment:
      POSTGRES_DB: deokhugam
      POSTGRES_USER: team4
      POSTGRES_PASSWORD: deokhugam4!
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: deokhugam-redis
    ports:
      - "6379:6379"